name: iOS CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (iPhone 17 Pro, iOS 26.5)
    # Pinned so Xcode and the simulators don't change under the snapshot tests, which were
    # recorded with Xcode 26.6 on the iPhone 17 Pro simulator, iOS 26.5.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Test
        run: |
          xcodebuild test \
            -project Prato.xcodeproj \
            -scheme Prato \
            -destination "$DESTINATION" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
